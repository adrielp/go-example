apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-example
  labels:
    app: go-example
spec:
  selector:
    matchLabels:
      app: go-example
  template:
    metadata:
      labels:
        app: go-example
    spec:
      containers:
        - name: go-example
          image: ghcr.io/adrielp/go-example:latest-amd64
          env:
            - name: SERVICE_PORT
              value: "8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otelcol-collector:4317"
            - name: USER
              value: go-example
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=go-example,service.namespace=example-team"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /v1/hello
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /v1/hello
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 2
